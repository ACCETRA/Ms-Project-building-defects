    kind: images
    google_drive_file_id: 1LEaYyASd7nHL-RryO1i-ucF2X5NAikqo
    local_path: datasets/building-target/CUBIT-InSeg/CUBIT-InSeg/train/images.zip
    expected_members: 5596
  - split: train
    kind: labels
    google_drive_file_id: 1KEYRaHPRZ6G3ScoOOsFjzDYDzOzVXeUg
    local_path: datasets/building-target/CUBIT-InSeg/CUBIT-InSeg/train/labels.zip
    expected_members: 5596
  - split: val
    kind: images
    google_drive_file_id: 1lO3fmx-d1z2MMZY7IWH7qElima_tlRC9
    local_path: datasets/building-target/CUBIT-InSeg/CUBIT-InSeg/val/images.zip
    expected_members: 699
  - split: val
    kind: labels
