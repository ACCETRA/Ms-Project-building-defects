schema_version: 1
dataset:
  name: CUBIT-InSeg
  role: primary_public_building_facade_source
  repository: https://github.com/benyunzhao/CUBIT-InSeg
  official_download_folder: https://drive.google.com/drive/folders/1HqS0rMWgwsy70TbaZYFqwzgFxLL_hp_b
  license: CC-BY-4.0
  accessed: 2026-09-09
  annotation_format: yolo_instance_segmentation_polygons
  native_classes:
    0: crack
    1: spalling
  policy:
    preserve_official_splits: true
    test_split_locked: true
    test_labels_may_be_integrity_checked: true
    test_label_contents_may_be_profiled: false
    test_images_may_be_used_for_tuning: false

archives:
